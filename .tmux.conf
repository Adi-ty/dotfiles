set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Faster escape time for neovim
set -sg escape-time 10
set -g focus-events on

# PREFIX KEY  →  Ctrl-a
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# PANE SPLITTING
unbind %
bind-key '|' split-window -h -c "#{pane_current_path}"

unbind '"'
bind-key '-' split-window -v -c "#{pane_current_path}"

# RELOAD CONFIG
unbind r
bind r source-file ~/.tmux.conf \; display-message "  Config reloaded!"

# PANE RESIZING
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
# Zoom toggle
bind -r m resize-pane -Z

# Change session root to current pane path
bind M-c attach-session -c "#{pane_current_path}"

# MOUSE
set -g mouse on

# VI MODE & CLIPBOARD
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v'   send -X begin-selection
bind-key -T copy-mode-vi 'y'   send -X copy-pipe-and-cancel "pbcopy"
unbind -T copy-mode-vi MouseDragEnd1Pane

# WINDOWS & PANES
set -g base-index 1           # start window numbering at 1
set -g pane-base-index 1      # start pane numbering at 1
set -g renumber-windows on    # keep window numbers tidy on close
set -g history-limit 10000    # bigger scrollback buffer
# New windows open in current path
bind c new-window -c "#{pane_current_path}"

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persists tmux sessions after system restarts
set -g @plugin 'tmux-plugins/tmux-continuum' # automatic saves sessions for you every 15 minutes

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @yank_action 'copy-pipe-no-clear'

# initialize tmux plugin manager
run '~/.tmux/plugins/tpm/tpm'
